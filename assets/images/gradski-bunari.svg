<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ilustracija gradskih bunara, Četiri bunara">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0cd"/>
      <stop offset="100%" stop-color="#d4c8ad"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <!-- paved square -->
  <rect x="0" y="420" width="800" height="180" fill="#cbbf9f"/>
  <g stroke="#b6a884" stroke-width="2" opacity="0.6">
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="0" y1="530" x2="800" y2="530"/>
    <line x1="200" y1="420" x2="200" y2="600"/>
    <line x1="400" y1="420" x2="400" y2="600"/>
    <line x1="600" y1="420" x2="600" y2="600"/>
  </g>
  <!-- four wellheads -->
  <g fill="#efe7d6" stroke="#a8966b" stroke-width="3">
    <rect x="150" y="330" width="80" height="100" rx="6"/>
    <rect x="290" y="330" width="80" height="100" rx="6"/>
    <rect x="430" y="330" width="80" height="100" rx="6"/>
    <rect x="570" y="330" width="80" height="100" rx="6"/>
  </g>
  <g fill="#8c7b53">
    <circle cx="190" cy="350" r="14"/>
    <circle cx="330" cy="350" r="14"/>
    <circle cx="470" cy="350" r="14"/>
    <circle cx="610" cy="350" r="14"/>
  </g>
  <text x="400" y="560" font-family="Georgia, serif" font-size="30" fill="#3a3527" text-anchor="middle">Četiri bunara</text>
</svg>
